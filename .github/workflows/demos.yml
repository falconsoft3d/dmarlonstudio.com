name: demos

# Compila las demos de la landing (dmarlonstudio.com/demos) para macOS y
# Windows (cada una, una sola app en español y en inglés, con el menú Idioma /
# Language de scripts/demo-lang) y las publica en la release «demos», que es
# de donde las enlaza la landing (landing/lib/demos.ts). Cada demo es un
# ejemplo del estudio exportado tal cual (studio/test/demos_export_test.dart)
# y compilado con scripts/build_demos.py.
on:
  push:
    branches: [main]
    paths:
      - 'studio/lib/code/**'
      - 'studio/assets/i18n/**'
      - 'studio/test/demos_export_test.dart'
      - 'scripts/build_demos.py'
      - 'scripts/demos.entitlements'
      - 'scripts/demo-lang/**'
      - 'scripts/demo-icons/**'
      - 'scripts/build_live_demos.py'
      - '.github/workflows/demos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.4
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Lazarus para la demo de Pascal (como lo instala el estudio).
      - name: Lazarus (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          brew install fpc
          brew install --cask lazarus
          echo "LAZBUILD=/Applications/Lazarus/lazbuild" >> "$GITHUB_ENV"
      - name: Lazarus (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install lazarus -y --no-progress
          "LAZBUILD=C:\lazarus\lazbuild.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem "C:\Program Files\OpenSSL\bin" -Filter *.dll | Select-Object Name
      # FLTK para la demo de C++ (cpp_explorer). En macOS, la de Homebrew
      # (build_demos.py enlaza sus .a: la .app no depende de Homebrew; sale
      # para Apple Silicon, la arquitectura del runner). En Windows, el g++ y
      # el FLTK de MSYS2 (UCRT64): un solo .exe estático.
      - name: FLTK (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: brew install fltk
      - name: MSYS2 con g++ y FLTK (Windows)
        if: runner.os == 'Windows'
        id: msys2
        continue-on-error: true
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-fltk
      # Go para el puente de MyWhatsapp con WhatsApp (scripts/demo-extra/wabridge).
      - name: Go
        continue-on-error: true
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/demo-extra/wabridge/go.mod
          cache-dependency-path: scripts/demo-extra/wabridge/go.sum
      - name: Dónde está MSYS2
        if: runner.os == 'Windows' && steps.msys2.outcome == 'success'
        shell: pwsh
        run: |
          "MSYS2_ROOT=${{ steps.msys2.outputs.msys2-location }}" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Exportar las demos
        working-directory: studio
        shell: bash
        run: |
          flutter pub get
          DMS_DEMOS_OUT="$GITHUB_WORKSPACE/demos-src" flutter test test/demos_export_test.dart
      # Firma con «Developer ID Application» y notarización de Apple, para que
      # macOS abra las demos sin avisos. Necesita estos secretos del repositorio
      # (los pone scripts/mac-signing-secrets.sh); si faltan, firma local.
      #   MACOS_CERT_P12, MACOS_CERT_PASSWORD: el certificado exportado (.p12)
      #   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER: clave de la API de
      #   App Store Connect (.p8) para notarytool
      - name: Certificado de Apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::Sin certificado de Apple: las demos de macOS van con firma local"
            exit 0
          fi
          KC="$RUNNER_TEMP/firma.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$ID" ]; then
            echo "::error::El .p12 no trae un certificado «Developer ID Application»"
            exit 1
          fi
          echo "DMS_SIGN_ID=$ID" >> "$GITHUB_ENV"
          if [ -n "$API_KEY" ]; then
            echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "DMS_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
            echo "DMS_NOTARY_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
            echo "DMS_NOTARY_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin clave de App Store Connect: las demos se firman pero no se notarizan"
          fi
      - name: Compilar
        shell: bash
        run: |
          python -m pip install pyinstaller==6.22.3 pillow==12.0.0
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          python scripts/build_demos.py demos-src demos-out
        env:
          DMS_UNIVERSAL: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: demos-${{ matrix.os }}
          path: demos-out/*.zip

  # Las demos móviles (Flutter) como APK de Android.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.4
          channel: stable
      - name: Exportar las demos móviles
        working-directory: studio
        run: |
          flutter pub get
          DMS_LIVE_OUT="$GITHUB_WORKSPACE/live-src" flutter test test/demos_export_test.dart
      - name: Compilar los APK
        run: python3 scripts/build_live_demos.py android live-src demos-out
      - uses: actions/upload-artifact@v4
        with:
          name: demos-android
          path: demos-out/*.apk

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: demos
          name: Demos de DMarlon Studio
          body: Aplicaciones de ejemplo hechas con DMarlon Studio, compiladas para macOS y Windows. Se descargan desde https://dmarlonstudio.com/demos
          prerelease: true
          make_latest: false
          files: |
            *.zip
            *.apk
