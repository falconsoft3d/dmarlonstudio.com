<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSIQUE · 20 personality tests</title>
<meta name="description" content="The 20 most used personality tests (Big Five, 4-letter type, Enneagram, DISC, attachment…) and a final profile to share.">
<style>
:root { --bg: #f6f5ff; --panel: #ffffff; --ink: #1e1b4b; --muted: #6b7280; --line: #e5e7f0; --accent: #6366f1; --accent2: #ec4899; --soft: #eef2ff; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f0d1f; --panel: #1a1730; --ink: #eef0ff; --muted: #a3a6c2; --line: #2c2847; --soft: #25214a; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: -20vh -20vw auto auto; width: 70vw; height: 70vh; background: radial-gradient(closest-side, rgba(99,102,241,.18), transparent); pointer-events: none; z-index: -1; }
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hin { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 10px 16px; }
#hHome { all: unset; cursor: pointer; display: flex; align-items: baseline; gap: 10px; }
.logo { font-weight: 900; font-size: 22px; letter-spacing: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
#hTag { color: var(--muted); font-size: 14px; }
.sp { flex: 1; }
#hProg { font-size: 14px; color: var(--muted); white-space: nowrap; } #hProg b { color: var(--ink); }
.hbar { height: 3px; background: var(--line); } #hBar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }
button { font: inherit; color: inherit; }
.btn { white-space: nowrap; border: 1px solid var(--line); background: var(--panel); padding: 10px 18px; border-radius: 999px; cursor: pointer; font-weight: 600; transition: transform .1s, box-shadow .2s; }
.btn:hover { box-shadow: 0 6px 18px rgba(99,102,241,.18); }
.btn:active { transform: scale(.98); }
.btn.primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; border: 0; }
.btn.ghost { background: transparent; }
.btn.small { padding: 7px 14px; font-size: 14px; }
.btn:disabled { opacity: .4; cursor: default; }
.link { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 60px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
.row.between { justify-content: space-between; }
.hero { padding: 26px 0 10px; max-width: 760px; }
.hero h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.08; margin: 0 0 12px; letter-spacing: -.5px; }
.hero p { color: var(--muted); font-size: 18px; margin: 0; }
.note { color: var(--muted); font-size: 14px !important; margin-top: 16px !important; padding: 10px 14px; background: var(--soft); border-radius: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 26px; }
.card { position: relative; text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 18px 16px 16px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; overflow: hidden; transition: transform .15s, box-shadow .2s; }
.card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
.card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(30,27,75,.12); }
.card .num { position: absolute; top: 12px; right: 14px; font-size: 13px; color: var(--muted); font-weight: 700; }
.card .ic { font-size: 30px; }
.card b { font-size: 17px; line-height: 1.2; margin-top: 4px; }
.card small { color: var(--muted); font-size: 13px; }
.card .meta { font-size: 13px; color: var(--muted); margin-top: 6px; }
.card .chip { margin-top: 8px; align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); padding: 4px 10px; border-radius: 999px; }
.card.done { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
.tbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-weight: 600; flex-wrap: wrap; }
.test { max-width: 760px; margin: 0 auto; }
.qprog { height: 8px; border-radius: 99px; background: var(--line); margin: 18px 0 22px; overflow: hidden; } .qprog div { height: 100%; background: var(--c); transition: width .25s; }
.qn { color: var(--muted); font-size: 14px; margin: 0; font-weight: 600; }
.qt { font-size: clamp(24px, 3.4vw, 34px); line-height: 1.2; margin: 8px 0 26px; min-height: 2.4em; }
.opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.opt { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; border-radius: 16px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; font-size: 14px; font-weight: 600; text-align: center; transition: border-color .15s, background .15s, transform .1s; }
.opt kbd { font: 700 13px system-ui; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--muted); }
.opt:hover { border-color: var(--c); } .opt.sel { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--panel)); } .opt.sel kbd { background: var(--c); color: #fff; }
.hint { color: var(--muted); font-size: 13px; max-width: 70%; text-align: right; }
@media (max-width: 700px) { .hin { gap: 8px; padding: 8px 12px; } .logo { font-size: 18px; letter-spacing: 2px; } #hProg span { display: none; } .btn.small { padding: 6px 11px; font-size: 13px; } .opts { grid-template-columns: 1fr; } .opt { flex-direction: row; justify-content: flex-start; padding: 13px 14px; text-align: left; } .hint { display: none; } #hTag { display: none; } }
.result, .profile { max-width: 900px; margin: 0 auto; }
.rcard { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 22px; margin-top: 16px; }
.rcard h3 { margin: 14px 0 8px; font-size: 18px; } .rcard h3:first-child { margin-top: 0; }
.big { font-size: clamp(48px, 9vw, 86px); font-weight: 900; line-height: 1; letter-spacing: -1px; } .big.small { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; margin-bottom: 10px; }
.bar { margin: 12px 0 4px; } .bl { display: flex; justify-content: space-between; font-weight: 600; font-size: 15px; } .bl b { color: var(--muted); }
.bt { position: relative; height: 10px; border-radius: 99px; background: var(--line); margin-top: 5px; overflow: hidden; } .bt div { height: 100%; border-radius: 99px; transition: width .6s; }
.bt.two div { position: absolute; top: 0; } .dt { color: var(--muted); margin: 4px 0 12px; font-size: 15px; }
.pair { display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; gap: 10px; margin: 16px 0 2px; } .pair b { text-align: center; font-size: 20px; color: var(--muted); } .pair b.on { color: var(--c); }
.pair small { grid-column: 1 / -1; text-align: center; color: var(--muted); margin-top: -2px; }
.quad { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; } .quad span { padding: 12px; border-radius: 12px; background: var(--soft); text-align: center; color: var(--muted); font-weight: 600; } .quad span.on { background: var(--c); color: #fff; }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } @media (max-width: 800px) { .pgrid { grid-template-columns: 1fr; } }
.pgrid .rcard { margin-top: 16px; }
.story { font-size: 17px; line-height: 1.6; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .keys div { background: var(--soft); border-radius: 14px; padding: 10px 12px; } .keys small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; } .keys b { font-size: 15px; }
canvas#radar { width: 100%; height: auto; display: block; }
canvas#card { width: min(100%, 420px); height: auto; display: block; margin: 0 auto; border-radius: 18px; box-shadow: 0 18px 50px rgba(30,27,75,.35); }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 30px; }
</style>
</head>

<header><div class="hin"><button id="hHome"><span class="logo">PSIQUE</span><span id="hTag"></span></button><span class="sp"></span><span id="hProg"></span><button class="btn small" id="hProfile"></button><button class="btn small ghost" id="hLang"></button></div><div class="hbar"><div id="hBar"></div></div></header>

<script>
// ---- PSIQUE: los 20 tests. Preguntas propias, inspiradas en los modelos más usados.
// Cada ítem: [dimensión, +1 directo / -1 inverso, español, inglés].
// Escala de 1 a 5: de «Totalmente en desacuerdo» a «Totalmente de acuerdo» (o de «Nunca» a «Muy a menudo»).

const SCALES = {
  agree: [['Totalmente en desacuerdo', 'En desacuerdo', 'Ni de acuerdo ni en desacuerdo', 'De acuerdo', 'Totalmente de acuerdo'],
    ['Strongly disagree', 'Disagree', 'Neither agree nor disagree', 'Agree', 'Strongly agree']],
  freq: [['Nunca', 'Casi nunca', 'A veces', 'A menudo', 'Muy a menudo'], ['Never', 'Almost never', 'Sometimes', 'Fairly often', 'Very often']],
};

const TESTS = [];

TESTS.push({ id: 'big5', icon: '🌊', color: '#6366f1', kind: 'dims', scale: 'agree',
  name: ['Los cinco grandes (OCEAN)', 'The Big Five (OCEAN)'], model: ['Modelo de los cinco factores', 'Five-Factor Model'],
  about: ['El modelo de personalidad con más respaldo científico: apertura, responsabilidad, extraversión, amabilidad y estabilidad emocional.', 'The personality model with the most scientific support: openness, conscientiousness, extraversion, agreeableness and emotional stability.'],
  dims: { O: ['Apertura', 'Openness'], C: ['Responsabilidad', 'Conscientiousness'], E: ['Extraversión', 'Extraversion'], A: ['Amabilidad', 'Agreeableness'], N: ['Estabilidad emocional', 'Emotional stability'] },
  text: {
    O: ['Curiosa, imaginativa y abierta a ideas, arte y experiencias nuevas.', 'Curious, imaginative and open to ideas, art and new experiences.', 'Práctica y con los pies en la tierra: prefiere lo conocido y probado.', 'Practical and down to earth: you prefer the known and proven.'],
    C: ['Organizada, constante y fiable: termina lo que empieza.', 'Organised, steady and reliable: you finish what you start.', 'Flexible y espontánea; los planes y el orden le pesan.', 'Flexible and spontaneous; plans and order feel heavy.'],
    E: ['Sociable y enérgica: la gente le carga las pilas.', 'Sociable and energetic: people recharge you.', 'Reservada: recupera la energía a solas o con pocos.', 'Reserved: you recharge alone or with a few people.'],
    A: ['Cálida, cooperadora y confiada con los demás.', 'Warm, cooperative and trusting with others.', 'Directa y competitiva: dice lo que piensa aunque incomode.', 'Direct and competitive: you say what you think even if it stings.'],
    N: ['Serena: los contratiempos le afectan poco y se recupera rápido.', 'Calm: setbacks barely shake you and you bounce back fast.', 'Sensible a la presión: las preocupaciones le pesan más.', 'Sensitive to pressure: worries weigh more on you.'],
  },
  items: [
    ['E', 1, 'Me siento cómodo/a siendo el centro de atención.', 'I feel comfortable being the centre of attention.'],
    ['A', 1, 'Me intereso de verdad por los problemas de los demás.', 'I am genuinely interested in other people’s problems.'],
    ['C', 1, 'Tengo mis cosas ordenadas y sé dónde está cada una.', 'I keep my things in order and know where everything is.'],
    ['N', -1, 'Me preocupo por muchas cosas.', 'I worry about many things.'],
    ['O', 1, 'Me encanta pensar en ideas abstractas y teorías.', 'I love thinking about abstract ideas and theories.'],
    ['E', -1, 'En las reuniones prefiero quedarme en segundo plano.', 'At gatherings I prefer to stay in the background.'],
    ['A', -1, 'A veces soy frío/a con la gente.', 'I am sometimes cold towards people.'],
    ['C', -1, 'Dejo las tareas para el último momento.', 'I leave tasks until the last minute.'],
    ['N', 1, 'Mantengo la calma cuando las cosas se complican.', 'I stay calm when things get complicated.'],
    ['O', -1, 'El arte y la poesía me dicen poco.', 'Art and poetry don’t say much to me.'],
    ['E', 1, 'Empiezo conversaciones con desconocidos con facilidad.', 'I easily start conversations with strangers.'],
    ['A', 1, 'Me gusta ayudar aunque no gane nada a cambio.', 'I like helping even when I get nothing in return.'],
    ['C', 1, 'Cumplo los plazos que me pongo.', 'I meet the deadlines I set myself.'],
    ['N', -1, 'Mi estado de ánimo cambia con facilidad.', 'My mood changes easily.'],
    ['O', 1, 'Busco experiencias, comidas y lugares que no conozco.', 'I look for experiences, foods and places I don’t know.'],
    ['E', -1, 'Necesito mucho tiempo a solas para recuperarme.', 'I need a lot of time alone to recharge.'],
    ['A', -1, 'Me cuesta perdonar cuando alguien me falla.', 'I find it hard to forgive when someone lets me down.'],
    ['C', 1, 'Planifico antes de ponerme a trabajar.', 'I plan before I start working.'],
    ['N', 1, 'Rara vez me siento triste o desanimado/a.', 'I rarely feel sad or down.'],
    ['O', 1, 'Tengo una imaginación muy viva.', 'I have a vivid imagination.'],
  ] });

TESTS.push({ id: 'type', icon: '🧭', color: '#0ea5e9', kind: 'type', scale: 'agree',
  name: ['Tipo de personalidad de 4 letras', '4-letter personality type'], model: ['Tipos psicológicos de Jung', 'Jung’s psychological types'],
  about: ['Cuatro preferencias: de dónde saca su energía (E/I), cómo percibe (S/N), cómo decide (T/F) y cómo se organiza (J/P).', 'Four preferences: where you get energy (E/I), how you perceive (S/N), how you decide (T/F) and how you organise (J/P).'],
  dims: { EI: ['Introversión – Extraversión', 'Introversion – Extraversion'], SN: ['Sensación – Intuición', 'Sensing – Intuition'], TF: ['Pensamiento – Sentimiento', 'Thinking – Feeling'], JP: ['Juicio – Percepción', 'Judging – Perceiving'] },
  items: [
    ['EI', 1, 'Pienso mejor hablando en voz alta con otros.', 'I think best by talking out loud with others.'],
    ['EI', -1, 'Prefiero una conversación profunda con una persona a una fiesta grande.', 'I prefer a deep talk with one person to a big party.'],
    ['EI', 1, 'Tras un día social me siento con más energía, no menos.', 'After a social day I feel more energised, not less.'],
    ['EI', -1, 'Reflexiono mucho antes de compartir lo que pienso.', 'I reflect a lot before sharing what I think.'],
    ['SN', -1, 'Confío más en los hechos concretos que en las corazonadas.', 'I trust concrete facts more than hunches.'],
    ['SN', 1, 'Me fijo más en el significado y las posibilidades que en los detalles.', 'I notice meanings and possibilities more than details.'],
    ['SN', -1, 'Prefiero instrucciones paso a paso.', 'I prefer step-by-step instructions.'],
    ['SN', 1, 'Me aburre hacer las cosas siempre de la misma manera.', 'Doing things the same way every time bores me.'],
    ['TF', -1, 'Al decidir, la lógica pesa más que cómo se sentirá la gente.', 'When deciding, logic weighs more than how people will feel.'],
    ['TF', 1, 'Cuido mucho la armonía del grupo al tomar decisiones.', 'I care a lot about group harmony when making decisions.'],
    ['TF', -1, 'Prefiero una verdad incómoda a una mentira amable.', 'I prefer an uncomfortable truth to a kind lie.'],
    ['TF', 1, 'Me pongo fácilmente en el lugar de los demás antes de opinar.', 'I easily put myself in others’ shoes before giving an opinion.'],
    ['JP', -1, 'Me gusta tener el plan cerrado con antelación.', 'I like having the plan settled in advance.'],
    ['JP', 1, 'Prefiero dejar opciones abiertas y decidir sobre la marcha.', 'I prefer to keep options open and decide as I go.'],
    ['JP', -1, 'Termino el trabajo antes de divertirme.', 'I finish work before having fun.'],
    ['JP', 1, 'Las listas de tareas me agobian más que ayudarme.', 'To-do lists stress me more than they help.'],
  ] });

TESTS.push({ id: 'ennea', icon: '✳️', color: '#a855f7', kind: 'dims', scale: 'agree', top: 1,
  name: ['Eneagrama', 'Enneagram'], model: ['Los nueve tipos del eneagrama', 'The nine Enneagram types'],
  about: ['Nueve tipos según lo que más le mueve por dentro: hacer lo correcto, ser querido, lograr, ser auténtico, entender, estar seguro, disfrutar, controlar o estar en paz.', 'Nine types according to what drives you inside: being right, being loved, achieving, being authentic, understanding, being safe, enjoying, being in control or being at peace.'],
  dims: { 1: ['1 · Perfeccionista', '1 · Perfectionist'], 2: ['2 · Ayudador', '2 · Helper'], 3: ['3 · Triunfador', '3 · Achiever'], 4: ['4 · Individualista', '4 · Individualist'], 5: ['5 · Investigador', '5 · Investigator'], 6: ['6 · Leal', '6 · Loyalist'], 7: ['7 · Entusiasta', '7 · Enthusiast'], 8: ['8 · Desafiador', '8 · Challenger'], 9: ['9 · Pacificador', '9 · Peacemaker'] },
  text: {
    1: ['Busca hacer las cosas bien y mejorar el mundo; su reto es la autocrítica.', 'You seek to do things right and improve the world; your challenge is self-criticism.'],
    2: ['Generoso y atento a los demás; su reto es cuidarse también a sí mismo.', 'Generous and attentive to others; your challenge is caring for yourself too.'],
    3: ['Orientado a metas y a dar lo mejor; su reto es no confundir valer con lograr.', 'Goal-driven and eager to excel; your challenge is not to confuse worth with achievement.'],
    4: ['Sensible, creativo y auténtico; su reto es no quedarse en lo que falta.', 'Sensitive, creative and authentic; your challenge is not to dwell on what is missing.'],
    5: ['Observador y curioso, necesita entender; su reto es salir de la cabeza.', 'Observant and curious, you need to understand; your challenge is getting out of your head.'],
    6: ['Leal y previsor, anticipa los riesgos; su reto es confiar más.', 'Loyal and prepared, you anticipate risks; your challenge is trusting more.'],
    7: ['Alegre y lleno de planes; su reto es quedarse cuando algo se pone difícil.', 'Cheerful and full of plans; your challenge is staying when things get hard.'],
    8: ['Fuerte, directo y protector; su reto es mostrar su lado vulnerable.', 'Strong, direct and protective; your challenge is showing your vulnerable side.'],
    9: ['Tranquilo y conciliador; su reto es no borrarse para evitar el conflicto.', 'Easy-going and conciliatory; your challenge is not erasing yourself to avoid conflict.'],
  },
  items: [
    ['1', 1, 'Me molesta mucho cuando algo no está bien hecho.', 'It bothers me a lot when something isn’t done properly.'],
    ['1', 1, 'Tengo una voz interior que me corrige a menudo.', 'I have an inner voice that often corrects me.'],
    ['2', 1, 'Me siento bien cuando los demás me necesitan.', 'I feel good when others need me.'],
    ['2', 1, 'Me cuesta decir que no a quien me pide ayuda.', 'I find it hard to say no to someone asking for help.'],
    ['3', 1, 'Me importa mucho tener éxito y que se note.', 'Being successful, and having it show, matters a lot to me.'],
    ['3', 1, 'Me adapto a lo que se espera de mí para causar buena impresión.', 'I adapt to what is expected of me to make a good impression.'],
    ['4', 1, 'Siento que soy diferente a la mayoría de la gente.', 'I feel I am different from most people.'],
    ['4', 1, 'Vivo mis emociones con mucha intensidad.', 'I experience my emotions very intensely.'],
    ['5', 1, 'Necesito entender algo a fondo antes de actuar.', 'I need to understand something thoroughly before acting.'],
    ['5', 1, 'Protejo mucho mi tiempo y mi espacio personal.', 'I guard my time and personal space closely.'],
    ['6', 1, 'Suelo pensar en lo que podría salir mal.', 'I tend to think about what could go wrong.'],
    ['6', 1, 'La lealtad es de lo que más valoro en una persona.', 'Loyalty is one of the things I value most in a person.'],
    ['7', 1, 'Siempre tengo planes nuevos y emocionantes en la cabeza.', 'I always have new, exciting plans in my head.'],
    ['7', 1, 'Evito quedarme mucho tiempo en emociones tristes.', 'I avoid staying long in sad emotions.'],
    ['8', 1, 'Me gusta tener el control de las situaciones.', 'I like being in control of situations.'],
    ['8', 1, 'Defiendo con fuerza a quien considero débil o tratado injustamente.', 'I strongly defend those who are weak or treated unfairly.'],
    ['9', 1, 'Haría casi cualquier cosa por evitar un conflicto.', 'I would do almost anything to avoid a conflict.'],
    ['9', 1, 'Me adapto fácilmente a lo que quieren los demás.', 'I easily go along with what others want.'],

TESTS.push({ id: 'disc', icon: '🎯', color: '#ef4444', kind: 'dims', scale: 'agree', top: 1,
  name: ['Estilo de comportamiento DISC', 'DISC behaviour style'], model: ['Modelo DISC de Marston', 'Marston’s DISC model'],

  items: [
    ['D', 1, 'Tomo decisiones rápidas, aunque no tenga toda la información.', 'I make quick decisions, even without all the information.'],
    ['D', 1, 'Me motivan los retos difíciles y la competencia.', 'Tough challenges and competition motivate me.'],
    ['D', 1, 'Prefiero dirigir a que me dirijan.', 'I prefer leading to being led.'],
    ['I', 1, 'Me resulta fácil convencer a la gente de mis ideas.', 'I find it easy to win people over to my ideas.'],
    ['I', 1, 'Disfruto animando a un grupo.', 'I enjoy energising a group.'],
    ['I', 1, 'Hago amigos con rapidez.', 'I make friends quickly.'],
    ['S', 1, 'Prefiero un ritmo tranquilo y previsible.', 'I prefer a calm, predictable pace.'],
    ['S', 1, 'Escucho con paciencia antes de responder.', 'I listen patiently before answering.'],
    ['S', 1, 'Los cambios bruscos me incomodan.', 'Sudden changes make me uncomfortable.'],
    ['C', 1, 'Reviso los detalles para evitar errores.', 'I check the details to avoid mistakes.'],
    ['C', 1, 'Me gusta seguir normas y procedimientos claros.', 'I like following clear rules and procedures.'],
    ['C', 1, 'Antes de decidir, busco datos que lo respalden.', 'Before deciding, I look for data to back it up.'],

TESTS.push({ id: 'esteem', icon: '🌱', color: '#22c55e', kind: 'total', scale: 'agree',
  name: ['Autoestima', 'Self-esteem'], model: ['Inspirado en la escala de Rosenberg', 'Inspired by the Rosenberg scale'],

// ---- puntuación
function score(test, ans) {
  const sum = {}, n = {};
  test.items.forEach(([d, sign], i) => {
    const v = ans[i]; if (!(v >= 1)) return;
    const s = sign > 0 ? v : 6 - v;
    sum[d] = (sum[d] || 0) + s; n[d] = (n[d] || 0) + 1;
  });
  const pct = {};
  for (const d in sum) pct[d] = Math.round(((sum[d] / n[d] - 1) / 4) * 100);
  const r = { pct };
  if (test.kind === 'total') {
    r.total = pct.T;
    r.band = test.bands.find((b) => r.total < b[0]) || test.bands[test.bands.length - 1];
  } else if (test.kind === 'type') {
    const p = pct;
    r.code = (p.EI >= 50 ? 'E' : 'I') + (p.SN >= 50 ? 'N' : 'S') + (p.TF >= 50 ? 'F' : 'T') + (p.JP >= 50 ? 'P' : 'J');
  } else if (test.kind === 'attach') {
    const a = pct.ANX >= 50, v = pct.AVO >= 50;
    r.style = a && v ? 'fearful' : a ? 'anxious' : v ? 'avoidant' : 'secure';
  } else {
    r.rank = Object.keys(test.dims).sort((x, y) => (pct[y] ?? 0) - (pct[x] ?? 0));
  }
  return r;
}
const resultOf = (id) => (isDone(id) ? score(byId[id], S.answers[id]) : null);
// La frase corta del resultado principal (para las tarjetas y el perfil).
function headline(id) {
  const x = byId[id], r = resultOf(id);

  if (x.kind === 'total') return `${r.band[1 + L()]} · ${r.total}%`;
  if (x.kind === 'type') return `${r.code} · ${TYPE_NAMES[r.code][L()]}`;
  if (x.kind === 'attach') return x.styles[r.style][L()];
  if (id === 'ennea') return `${x.dims[r.rank[0]][L()]} · ${f(t('wing'), wingOf(r))}`;
  if (id === 'riasec') return r.rank.slice(0, 3).join('') + ' · ' + r.rank.slice(0, 3).map((k) => x.dims[k][L()]).join(', ');
  if (x.top) return r.rank.slice(0, x.top).map((k) => x.dims[k][L()]).join(' + ');
  // Las dos dimensiones más altas.
  return r.rank.slice(0, 2).map((k) => `${x.dims[k][L()]} ${r.pct[k]}%`).join(' · ');
}
// El ala del eneagrama: el tipo vecino (n-1 o n+1) con más puntos.
function wingOf(r) {
  const n = +r.rank[0], a = n === 1 ? 9 : n - 1, b = n === 9 ? 1 : n + 1;
  return (r.pct[a] ?? 0) >= (r.pct[b] ?? 0) ? a : b;
}

      <p class="qn">${esc(f(t('question'), i + 1, x.items.length))}</p>
      <h2 class="qt">${esc(x.items[i][2 + L()])}</h2>
      <div class="opts">${opts.map((o, k) => `<button class="opt ${a[i] === k + 1 ? 'sel' : ''}" data-v="${k + 1}"><kbd>${k + 1}</kbd><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="row between"><button class="btn ghost" id="qPrev" ${i === 0 ? 'disabled' : ''}>← ${esc(t('prev'))}</button><span class="hint">${esc(x.about[L()])}</span></div>
    </section>`);
  document.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => pick(+b.dataset.v)));
  $('#qPrev').addEventListener('click', () => { if (cur.i > 0) { cur.i--; renderQ(); } });
}
function pick(v) {
  const x = byId[cur.id];
  S.answers[cur.id][cur.i] = v; save();
  const btn = document.querySelector(`.opt[data-v="${v}"]`); if (btn) btn.classList.add('sel');
  setTimeout(() => {
    if (cur.i + 1 < x.items.length) { cur.i++; renderQ(); }
    else { const id = cur.id; cur = { id: null, i: 0 }; go(`#/result/${id}`); }
  }, 160);
}
addEventListener('keydown', (e) => {
  if (!location.hash.startsWith('#/test/') || !cur.id) return;
  if (/^[1-5]$/.test(e.key)) pick(+e.key);
  else if (e.key === 'ArrowLeft' && cur.i > 0) { cur.i--; renderQ(); }
});

// ---- el resultado de un test
function bar(label, pct, color, left) {
  return `<div class="bar"><div class="bl"><span>${esc(label)}</span><b>${pct}%</b></div><div class="bt">${left ? `<i class="mid"></i>` : ''}<div style="width:${pct}%;background:${color}"></div></div></div>`;
}
function dimText(x, k, p) {
  const tx = x.text && x.text[k];
  if (!tx) return '';
  if (tx.length === 2) return tx[L()];
  return p >= 55 ? tx[L()] : p < 45 ? tx[2 + L()] : t('mid');
}
function showResult(id) {
  const x = byId[id], r = resultOf(id), idx = TESTS.indexOf(x), next = TESTS.slice(idx + 1).concat(TESTS.slice(0, idx)).find((y) => !isDone(y.id));
  let body = '';
  if (x.kind === 'total') {
    body = `<div class="big" style="color:${x.color}">${r.total}%</div><h3>${esc(r.band[1 + L()])}</h3><p>${esc(r.band[3 + L()])}</p>${bar(x.name[L()], r.total, x.color)}`;
  } else if (x.kind === 'type') {
    const pairs = [['EI', 'E', 'I'], ['SN', 'N', 'S'], ['TF', 'F', 'T'], ['JP', 'P', 'J']];
    body = `<div class="big" style="color:${x.color}">${r.code}</div><h3>${esc(TYPE_NAMES[r.code][L()])}</h3>
      <p>${esc(cap(r.code.split('').map((c) => TYPE_TEXT[c][L()]).join(', ')))}.</p>
      ${pairs.map(([k, hi, lo]) => { const p = r.pct[k]; const w = p >= 50 ? hi : lo; return `<div class="pair"><b class="${w === lo ? 'on' : ''}">${lo}</b><div class="bt two"><div style="left:50%;width:${Math.abs(p - 50)}%;${p < 50 ? `transform:translateX(-100%);` : ''}background:${x.color}"></div></div><b class="${w === hi ? 'on' : ''}">${hi}</b><small>${esc(x.dims[k][L()])}</small></div>`; }).join('')}`;
  } else if (x.kind === 'attach') {
    const st = x.styles[r.style];
    body = `<div class="big" style="color:${x.color}">${esc(st[L()])}</div><p>${esc(st[2 + L()])}</p>${bar(x.dims.ANX[L()], r.pct.ANX, x.color)}${bar(x.dims.AVO[L()], r.pct.AVO, x.color)}
      <div class="quad">${['anxious', 'fearful', 'secure', 'avoidant'].map((k) => `<span class="${k === r.style ? 'on' : ''}">${esc(x.styles[k][L()])}</span>`).join('')}</div>`;
  } else {
    const keys = x.top ? r.rank : Object.keys(x.dims);
    const main = x.top ? `<div class="big small" style="color:${x.color}">${esc(headline(id))}</div>` : '';
    body = main + keys.map((k) => `${bar(x.dims[k][L()], r.pct[k], x.color)}${(!x.top || keys.indexOf(k) < (x.top || 9)) ? `<p class="dt">${esc(dimText(x, k, r.pct[k]))}</p>` : ''}`).join('');
  }
  frame(`
    <section class="result" style="--c:${x.color}">
      <div class="tbar"><button class="link" data-go="#/">← ${esc(t('allTests'))}</button><span>${x.icon} ${esc(x.name[L()])}</span></div>
      <p class="qn">${esc(t('result'))} · ${esc(t('inspired'))}: ${esc(x.model[L()])}</p>
      <div class="rcard">${body}</div>
      <div class="row">${next ? `<button class="btn primary" data-go="#/test/${next.id}">${esc(t('next'))}: ${next.icon} ${esc(next.name[L()])} →</button>` : ''}<button class="btn" data-go="#/profile">${esc(t('seeProfile'))}</button><button class="btn ghost" id="redo">${esc(t('redo'))}</button></div>
    </section>`);
  $('#redo').addEventListener('click', () => { delete S.answers[id]; save(); cur = { id: null, i: 0 }; go(`#/test/${id}`); });
}

// ---- el perfil: todo junto
function profileData() {
  const d = { n: doneCount(), keys: [], well: [], sentences: [] };
  const big = resultOf('big5');
  if (big) {
    d.big = big.pct;
    const order = Object.keys(big.pct).sort((a, b) => Math.abs(big.pct[b] - 50) - Math.abs(big.pct[a] - 50)).slice(0, 3);
    const words = order.map((k) => t('adj')[k][big.pct[k] >= 50 ? 0 : 1]);
    d.sentences.push(f(t('s_big5'), ...words));
  }
  const ty = resultOf('type');
  if (ty) { d.type = ty.code; d.keys.push([t('k_type'), `${ty.code} · ${TYPE_NAMES[ty.code][L()]}`]); d.sentences.push(f(t('s_type'), ty.code, TYPE_NAMES[ty.code][L()], ty.code.split('').map((c) => TYPE_TEXT[c][L()]).join(', '))); }
  const en = resultOf('ennea');
  if (en) { const x = byId.ennea; d.keys.push([t('k_ennea'), `${x.dims[en.rank[0]][L()]} (${f(t('wing'), wingOf(en))})`]); d.sentences.push(f(t('s_ennea'), x.dims[en.rank[0]][L()], x.text[en.rank[0]][L()])); }
  const di = resultOf('disc');
  if (di) { const x = byId.disc; d.keys.push([t('k_disc'), x.dims[di.rank[0]][L()]]); d.sentences.push(f(t('s_disc'), x.dims[di.rank[0]][L()].toLowerCase())); }
  const at = resultOf('attach');
  if (at) { const s = byId.attach.styles[at.style][L()]; d.keys.push([t('k_attach'), s]); d.sentences.push(f(t('s_attach'), s.toLowerCase())); }
  const lo = resultOf('love');
  if (lo) { const s = byId.love.dims[lo.rank[0]][L()]; d.keys.push([t('k_love'), s]); d.sentences.push(f(t('s_love'), s.toLowerCase())); }
  const ri = resultOf('riasec');
  if (ri) { const x = byId.riasec, c = ri.rank.slice(0, 3); d.keys.push([t('k_riasec'), `${c.join('')} · ${c.map((k) => x.dims[k][L()]).join(', ')}`]); d.sentences.push(f(t('s_riasec'), c.map((k) => x.dims[k][L()].toLowerCase()).join(', '))); }
  const mi = resultOf('mi');
  if (mi) d.keys.push([t('k_mi'), mi.rank.slice(0, 2).map((k) => byId.mi.dims[k][L()]).join(' + ')]);
  const le = resultOf('learn');
  if (le) d.keys.push([t('k_learn'), byId.learn.dims[le.rank[0]][L()]]);
  for (const id of ['esteem', 'swls', 'optimism', 'resil', 'grit', 'mindset', 'assert', 'stress']) {
    const r = resultOf(id); if (r) d.well.push([byId[id], r.total, r.band[1 + L()]]);
  }
  for (const id of ['ei', 'empathy', 'dark']) {
    const r = resultOf(id); if (!r) continue;
    const vals = Object.values(r.pct), avg = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
    d.well.push([byId[id], avg, avg >= 60 ? t('high') : avg < 40 ? t('low') : t('medium')]);
  }
  return d;
}
function showProfile() {
  const d = profileData();
  frame(`
    <section class="profile">
      <div class="tbar"><button class="link" data-go="#/">← ${esc(t('allTests'))}</button><span>✨ ${esc(t('profTitle'))}</span></div>
      ${d.n === 0 ? `<div class="rcard"><p>${esc(t('profEmpty'))}</p><button class="btn primary" data-go="#/test/big5">${esc(t('start'))} →</button></div>` : `
      ${d.n < 20 ? `<p class="note">${esc(f(t('profPartial'), d.n))}</p>` : ''}
      <div class="pgrid">
        <div class="rcard"><h3>${esc(t('summary'))}</h3><p class="story">${d.sentences.map(esc).join(' ')}</p>
          ${d.keys.length ? `<h3>${esc(t('keys'))}</h3><div class="keys">${d.keys.map(([k, v]) => `<div><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>` : ''}</div>
        <div class="rcard">${d.big ? `<h3>${esc(t('traits'))}</h3><canvas id="radar" width="520" height="440"></canvas>` : ''}
          ${d.well.length ? `<h3>${esc(t('wellbeing'))}</h3>${d.well.map(([x, p, lab]) => bar(`${x.icon} ${x.name[L()]} · ${lab}`, p, x.color)).join('')}` : ''}</div>
      </div>
      <div class="rcard"><canvas id="card" width="1080" height="1350"></canvas>
        <div class="row"><button class="btn primary" id="pShare">${esc(t('share'))}</button><button class="btn" id="pDown">${esc(t('download'))}</button><button class="btn ghost" id="pCopy">${esc(t('copy'))}</button><button class="btn ghost" id="pReset">${esc(t('reset'))}</button></div></div>`}
    </section>`);
  if (d.n === 0) return;
  if (d.big) radar($('#radar'), d.big, 520, 440, false);
  drawCard($('#card'), d);
  const text = () => f(t('shareText'), [d.type, ...d.keys.slice(1, 4).map((k) => k[1])].filter(Boolean).join(' · ') || `${d.n}/20`);
  const blob = () => new Promise((res) => $('#card').toBlob(res, 'image/png'));
  $('#pDown').addEventListener('click', async () => { const b = await blob(); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'psique-perfil.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); });
  $('#pShare').addEventListener('click', async () => {
    try {
      const file = new File([await blob()], 'psique-perfil.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) return await navigator.share({ files: [file], title: 'PSIQUE', text: text() });
      if (navigator.share) return await navigator.share({ title: 'PSIQUE', text: text(), url: location.href.split('#')[0] });
    } catch (e) { if (e && e.name === 'AbortError') return; }
    $('#pDown').click();
  });
  $('#pCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(`${text()} ${location.href.split('#')[0]}`); $('#pCopy').textContent = t('copied'); } catch (e) {} });
  $('#pReset').addEventListener('click', () => { if (confirm(t('resetQ'))) { S = { answers: {} }; save(); go('#/'); } });
}

// ---- dibujo: el radar de los cinco grandes y la tarjeta para compartir
function radar(cv, p, W, H, onDark) {
  const g = cv.getContext('2d'), keys = ['O', 'C', 'E', 'A', 'N'], dims = byId.big5.dims;
  const cx = W / 2, cy = H / 2 + 6, R = Math.min(W, H) * 0.29;
  g.clearRect(0, 0, W, H);
  const pt = (i, r) => [cx + Math.cos(-Math.PI / 2 + (i * 2 * Math.PI) / 5) * r, cy + Math.sin(-Math.PI / 2 + (i * 2 * Math.PI) / 5) * r];
  g.strokeStyle = onDark ? 'rgba(255,255,255,.22)' : 'rgba(100,116,139,.3)'; g.lineWidth = 1;
  for (const k of [0.25, 0.5, 0.75, 1]) { g.beginPath(); keys.forEach((_, i) => g.lineTo(...pt(i, R * k))); g.closePath(); g.stroke(); }
  keys.forEach((_, i) => { g.beginPath(); g.moveTo(cx, cy); g.lineTo(...pt(i, R)); g.stroke(); });
  const grad = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R); grad.addColorStop(0, 'rgba(99,102,241,.55)'); grad.addColorStop(1, 'rgba(236,72,153,.55)');
  g.fillStyle = grad; g.strokeStyle = '#6366f1'; g.lineWidth = 3;
  g.beginPath(); keys.forEach((k, i) => g.lineTo(...pt(i, R * Math.max(0.04, p[k] / 100)))); g.closePath(); g.fill(); g.stroke();
  g.font = `600 ${Math.round(W / 34)}px system-ui, -apple-system, Segoe UI, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  keys.forEach((k, i) => {
    const [x, y] = pt(i, R + W / 11);
    g.fillStyle = onDark ? '#fff' : getComputedStyle(document.body).getPropertyValue('--ink') || '#111';
    g.fillText(dims[k][L()], x, y - W / 70);
    g.fillStyle = onDark ? '#c7d2fe' : '#6366f1'; g.fillText(`${p[k]}%`, x, y + W / 36);
  });
}
function drawCard(cv, d) {
  const g = cv.getContext('2d'), W = 1080, H = 1350;
  const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#1e1b4b'); bg.addColorStop(0.55, '#4c1d95'); bg.addColorStop(1, '#831843');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 26; i++) { g.fillStyle = `rgba(255,255,255,${0.02 + (i % 4) * 0.008})`; g.beginPath(); g.arc((i * 263) % W, (i * 419) % H, 40 + ((i * 37) % 120), 0, 7); g.fill(); }
  g.textAlign = 'center'; g.fillStyle = '#c7d2fe'; g.font = '600 34px system-ui, -apple-system, Segoe UI, sans-serif'; g.fillText(t('cardTitle'), W / 2, 110);
  g.fillStyle = '#fff'; g.font = '800 64px system-ui, -apple-system, Segoe UI, sans-serif'; g.fillText('PSIQUE', W / 2, 185);
  let y = 300;
  if (d.type) {
    g.font = '900 150px system-ui, -apple-system, Segoe UI, sans-serif'; g.fillStyle = '#fde68a'; g.fillText(d.type, W / 2, y + 40);
    g.font = '600 46px system-ui, -apple-system, Segoe UI, sans-serif'; g.fillStyle = '#fff'; g.fillText(TYPE_NAMES[d.type][L()], W / 2, y + 110); y += 170;
  }
  if (d.big) {
    const c = document.createElement('canvas'); c.width = 680; c.height = 420; radar(c, d.big, 680, 420, true);
    g.drawImage(c, (W - 680) / 2, y - 10); y += 420;
  }
  const keys = d.keys.filter((k) => k[0] !== t('k_type')).slice(0, 6);
  const cw = 470, chh = 88;
  keys.forEach(([k, v], i) => {
    const x = i % 2 ? W / 2 + 10 : W / 2 - 10 - cw, yy = y + Math.floor(i / 2) * (chh + 12);
    g.fillStyle = 'rgba(255,255,255,.12)'; roundRect(g, x, yy, cw, chh, 22); g.fill();
    g.textAlign = 'left'; g.fillStyle = '#c7d2fe'; g.font = '600 24px system-ui, -apple-system, Segoe UI, sans-serif'; g.fillText(k.toUpperCase(), x + 26, yy + 33);
    g.fillStyle = '#fff'; g.font = '700 30px system-ui, -apple-system, Segoe UI, sans-serif'; g.fillText(fitText(g, v, cw - 52), x + 26, yy + 68);
  });
  g.textAlign = 'center'; g.fillStyle = 'rgba(255,255,255,.75)'; g.font = '500 28px system-ui, -apple-system, Segoe UI, sans-serif';
  g.fillText(`${f(t('tests20'), d.n)} · ${t('cardFoot')}`, W / 2, H - 90);
  g.fillStyle = '#fde68a'; g.font = '600 28px system-ui, -apple-system, Segoe UI, sans-serif'; g.fillText('dmarlonstudio.com', W / 2, H - 46);
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function fitText(g, s, w) { if (g.measureText(s).width <= w) return s; while (s && g.measureText(s + '…').width > w) s = s.slice(0, -1); return s + '…'; }

document.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) { e.preventDefault(); go(b.dataset.go); } });
$('#hLang').addEventListener('click', () => { lang = lang === 'es' ? 'en' : 'es'; route(); });
$('#hProfile').addEventListener('click', () => go('#/profile'));
$('#hHome').addEventListener('click', () => go('#/'));
// Para las pruebas y las capturas: responder un test entero con un patrón.
window.PS = { TESTS, S, score, resultOf, headline, profileData, go, fill(id, fn) { S.answers[id] = byId[id].items.map((it, i) => fn(it, i)); save(); }, reset() { S.answers = {}; save(); } };
route();
