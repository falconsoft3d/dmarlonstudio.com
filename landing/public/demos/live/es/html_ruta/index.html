<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUTA PELIGROSA · Cargas peligrosas en Argentina</title>
<meta name="description" content="Juego educativo: 10 misiones y 100 pruebas sobre el transporte de mercancías peligrosas por carretera en Argentina, con diploma final.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root { --o: #f28c1b; --y: #ffd600; --g: #7ee07e; --r: #ff4d4d; --ink: #0b0d10; --panel: rgba(8,10,14,.88); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; color: #fff; font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; transition: filter .3s; }
.anton { font-family: Anton, Impact, sans-serif; letter-spacing: .5px; }
button { font: inherit; color: inherit; cursor: pointer; }
/* ---- HUD ---- */
.hud { display: none; }
body.driving .hud { display: block; }
#hTL { position: fixed; left: 16px; top: 14px; max-width: min(46vw, 420px); text-shadow: 0 2px 3px #000; }
#hMission { font: 26px Anton, Impact, sans-serif; line-height: 1; }
#hRoute { font-size: 17px; font-weight: 600; opacity: .9; margin-top: 3px; }
#hCargo { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 15px; font-weight: 600; }
#hTR { position: fixed; right: 16px; top: 12px; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
#hScore { font: 40px Anton, Impact, sans-serif; color: var(--g); -webkit-text-stroke: 2px #000; paint-order: stroke; line-height: 1; letter-spacing: 1px; }
#hStars { display: flex; gap: 2px; justify-content: flex-end; margin-top: 4px; }
#hStars i { font-style: normal; font-size: 26px; color: rgba(255,255,255,.18); -webkit-text-stroke: 1.5px #000; transition: color .2s, transform .2s; }
#hStars i.on { color: #fff; transform: scale(1.12); animation: flash .5s infinite alternate; }
@keyframes flash { to { color: #ffe680; } }
#hTest { font-size: 17px; font-weight: 700; margin-top: 2px; text-shadow: 0 2px 3px #000; }
#hLights { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 3px; font-size: 13px; font-weight: 800; background: rgba(0,0,0,.6); color: #888; letter-spacing: 1px; }
#hLights.on { color: #9fd3ff; box-shadow: inset 0 0 0 1px #4aa3ff; }
.opanel { display: inline-flex; flex-direction: column; background: var(--o); border: 3px solid #111; min-width: 74px; font: 21px Anton, Impact, sans-serif; color: #111; line-height: 1.08; }
.opanel i { font-style: normal; text-align: center; padding: 1px 8px; }
.opanel i + i { border-top: 3px solid #111; }
.opanel.sm { min-width: 44px; font-size: 13px; border-width: 2px; }
.opanel.sm i + i { border-top-width: 2px; }
#obj { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -20px); opacity: 0; transition: .35s; max-width: min(560px, 40vw); text-align: center; background: var(--panel); border-left: 4px solid #4aa3ff; padding: 8px 14px; pointer-events: none; }
#obj.show { opacity: 1; transform: translate(-50%, 0); }
#objT { font: 18px Anton, Impact, sans-serif; color: #9fd3ff; letter-spacing: 1px; text-transform: uppercase; }
#objS { font-size: 17px; font-weight: 600; }
#sub { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); width: min(720px, 56vw); text-align: center; opacity: 0; transition: opacity .3s; text-shadow: 0 2px 3px #000, 0 0 8px #000; font-size: 21px; font-weight: 600; pointer-events: none; }
#sub.show { opacity: 1; }
#subWho { color: var(--y); font-weight: 800; margin-right: 6px; }
.toast { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.9); opacity: 0; transition: .3s; text-align: center; pointer-events: none; width: min(560px, 90vw); }
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#toastT { font: 44px Anton, Impact, sans-serif; -webkit-text-stroke: 2px #000; paint-order: stroke; letter-spacing: 1px; }
#toastS { font-size: 19px; font-weight: 600; text-shadow: 0 2px 3px #000; margin-top: 2px; }
.toast.ok #toastT { color: var(--g); } .toast.bad #toastT { color: var(--r); } .toast.info #toastT { color: #fff; font-size: 30px; }
.banner { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity .5s; background: linear-gradient(transparent 30%, rgba(0,0,0,.55) 45%, rgba(0,0,0,.55) 60%, transparent 75%); }
.banner.show { opacity: 1; }
#bSmall { font: 26px Anton, Impact, sans-serif; color: var(--y); letter-spacing: 3px; }
#bBig { font: clamp(46px, 9vw, 96px) Anton, Impact, sans-serif; font-style: italic; -webkit-text-stroke: 3px #000; paint-order: stroke; transform: rotate(-2deg); line-height: 1.05; text-align: center; }
#bSub { font-size: 22px; font-weight: 600; margin-top: 6px; }
.big { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity .4s; }
.big.show { opacity: 1; }
#bigT { font: clamp(64px, 13vw, 150px) Anton, Impact, sans-serif; -webkit-text-stroke: 4px #000; paint-order: stroke; letter-spacing: 3px; }
.big.crash #bigT { color: #c62828; } .big.held #bigT { color: #3d7bff; }
#bigS { font-size: 22px; font-weight: 600; text-shadow: 0 2px 4px #000; text-align: center; padding: 0 20px; }
/* Táctil */
#touch { display: none; }
@media (pointer: coarse) { body.driving #touch { display: block; } #sub { bottom: 120px; } }
#touch button { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(0,0,0,.5); font-size: 24px; font-weight: 800; touch-action: none; }
#tLeft { left: 16px; } #tRight { left: 92px; } #tDown { right: 92px; } #tUp { right: 16px; background: rgba(46,125,50,.6) !important; }
#tLights { right: 168px; font-size: 13px !important; } #tPause { top: calc(118px + env(safe-area-inset-top)); bottom: auto !important; right: 16px; width: 40px !important; height: 40px !important; font-size: 15px !important; }
/* ---- Pregunta ---- */
#quiz { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(rgba(0,0,0,.35), rgba(0,0,0,.75)); backdrop-filter: saturate(.3) blur(2px); opacity: 0; pointer-events: none; transition: opacity .25s; padding: 16px; z-index: 5; }
#quiz.show { opacity: 1; pointer-events: auto; }
.card { width: min(760px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border-top: 6px solid var(--o); box-shadow: 0 20px 60px rgba(0,0,0,.6); padding: 18px 22px 20px; }
#qHead { font: 18px Anton, Impact, sans-serif; letter-spacing: 2px; color: var(--o); }
#qText { font-size: 27px; font-weight: 700; line-height: 1.15; margin: 8px 0 12px; }
.timer { height: 5px; background: rgba(255,255,255,.12); margin-bottom: 14px; } #qTimer { height: 100%; background: var(--y); transition: width .1s linear; }
.opts { display: grid; gap: 8px; }
.opts button { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; background: rgba(255,255,255,.07); border: 2px solid transparent; font-size: 20px; font-weight: 600; line-height: 1.15; transition: background .15s, border-color .15s; }
.opts button:hover:not(:disabled) { background: #fff; color: #000; }
.opts button kbd { font: 16px Anton, Impact, sans-serif; background: rgba(255,255,255,.15); min-width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 3px; flex: none; }
.opts button:hover:not(:disabled) kbd { background: #000; color: #fff; }
.opts button.right { border-color: var(--g); background: rgba(126,224,126,.18); }
.opts button.wrongc { border-color: var(--r); background: rgba(255,77,77,.18); }
.opts button:disabled { cursor: default; }
.opts.panels { grid-template-columns: repeat(4, 1fr); }
.opts.panels button { flex-direction: column; justify-content: center; padding: 12px 6px; }
.opts.panels .opanel { font-size: 30px; min-width: 100px; }
@media (max-width: 640px) { .opts.panels { grid-template-columns: repeat(2, 1fr); } #qText { font-size: 22px; } .opts button { font-size: 18px; } }
.feed { display: none; margin-top: 14px; padding: 10px 14px; border-left: 4px solid; }
.feed.show { display: block; } .feed.ok { border-color: var(--g); background: rgba(126,224,126,.08); } .feed.bad { border-color: var(--r); background: rgba(255,77,77,.08); }
.feed b { font: 22px Anton, Impact, sans-serif; letter-spacing: 1px; } .feed.ok b { color: var(--g); } .feed.bad b { color: var(--r); }
.feed p { margin: 4px 0; font-size: 18px; line-height: 1.25; } .feed small { font-size: 14px; opacity: .7; }
.go { margin-top: 14px; float: right; background: var(--o); color: #000; border: 0; padding: 8px 22px; font: 20px Anton, Impact, sans-serif; letter-spacing: 1px; }
/* ---- Pantallas ---- */
.screen { position: fixed; inset: 0; display: none; z-index: 8; overflow: auto; }
.screen.show { display: block; }
#menu { background: linear-gradient(100deg, rgba(10,8,20,.92) 0%, rgba(10,8,20,.6) 45%, rgba(255,110,40,.12) 100%); }
.menuIn { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 40px clamp(20px, 7vw, 110px); max-width: 760px; }
.logo { transform: rotate(-4deg); transform-origin: left; margin-bottom: 8px; }
.logo span { display: block; font-family: Anton, Impact, sans-serif; line-height: .92; -webkit-text-stroke: 4px #000; paint-order: stroke; }
.logo .l1 { font-size: clamp(54px, 10vw, 110px); color: #fff; }
.logo .l2 { font-size: clamp(64px, 12.5vw, 140px); color: var(--o); font-style: italic; text-shadow: 6px 6px 0 #000; }
#mTag { font-size: 24px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--y); margin: 6px 0 26px; }
.mbtns { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.mbtns button { background: rgba(0,0,0,.55); border: 0; border-left: 5px solid var(--o); padding: 9px 22px 9px 16px; font: 26px Anton, Impact, sans-serif; letter-spacing: 1px; text-transform: uppercase; min-width: 300px; text-align: left; transition: .15s; }
.mbtns button:hover, .mbtns button:focus-visible { background: #fff; color: #000; outline: none; padding-left: 24px; }
.mbtns button.dim { opacity: .55; }
#mProg { margin-top: 18px; font-size: 20px; min-height: 24px; } #mProg b { color: var(--g); }
#mDisc { margin-top: 18px; font-size: 15px; opacity: .65; max-width: 560px; line-height: 1.3; }
.inner { max-width: 900px; margin: 0 auto; padding: 34px 20px 50px; }
.inner h2 { font: clamp(40px, 7vw, 64px) Anton, Impact, sans-serif; font-style: italic; margin: 0 0 18px; -webkit-text-stroke: 2px #000; paint-order: stroke; }
#missions, #howto, #results { background: rgba(8,10,14,.93); }
#msList { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.mcard { display: flex; gap: 12px; align-items: center; text-align: left; background: rgba(255,255,255,.06); border: 0; border-left: 4px solid var(--o); padding: 10px 12px; }
.mcard:hover:not(:disabled) { background: rgba(255,255,255,.14); }
.mcard em { font: 38px Anton, Impact, sans-serif; font-style: normal; color: var(--o); min-width: 40px; text-align: center; }
.mcard span { flex: 1; display: flex; flex-direction: column; } .mcard b { font-size: 21px; } .mcard small { font-size: 15px; opacity: .75; }
.mcard i { font-style: normal; font-weight: 800; color: var(--g); font-size: 16px; white-space: nowrap; }
.mcard.lock { opacity: .4; cursor: default; border-color: #666; } .mcard.lock i { color: #aaa; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.btn { background: var(--o); color: #000; border: 0; padding: 9px 20px; font: 21px Anton, Impact, sans-serif; letter-spacing: 1px; }
.btn.ghost { background: rgba(255,255,255,.1); color: #fff; }
#howList { font-size: 21px; line-height: 1.35; padding-left: 22px; } #howList li { margin-bottom: 10px; } #howList b { color: var(--y); }
#mpassed { background: linear-gradient(transparent, rgba(0,0,0,.75) 30%, rgba(0,0,0,.75) 70%, transparent); display: none; }
#mpassed.show { display: flex; align-items: center; justify-content: center; }
.mpIn { text-align: center; padding: 20px; }
#mpTitle { font: clamp(52px, 10vw, 110px) Anton, Impact, sans-serif; font-style: italic; color: var(--y); -webkit-text-stroke: 4px #000; paint-order: stroke; transform: rotate(-2deg); text-shadow: 0 0 30px rgba(255,180,0,.45); }
#mpSub { font-size: 24px; font-weight: 600; margin-bottom: 14px; }
.stats { display: flex; gap: 28px; justify-content: center; margin: 10px 0 20px; flex-wrap: wrap; }
.stats div { display: flex; flex-direction: column; } .stats b { font: 40px Anton, Impact, sans-serif; color: var(--g); } .stats span { font-size: 16px; text-transform: uppercase; letter-spacing: 2px; opacity: .8; }
.mpIn .row { justify-content: center; }
#rTitle { font: 26px Anton, Impact, sans-serif; letter-spacing: 3px; color: var(--y); }
#rScore { font: clamp(80px, 16vw, 150px) Anton, Impact, sans-serif; color: var(--g); line-height: 1; -webkit-text-stroke: 3px #000; paint-order: stroke; } #rScore small { font-size: .4em; color: #fff; }
#rRank { font-size: 32px; font-weight: 800; color: var(--o); text-transform: uppercase; letter-spacing: 2px; }
#results .stats { justify-content: flex-start; }
.dipWrap { margin-top: 14px; } canvas#dip { width: 100%; height: auto; display: block; box-shadow: 0 16px 50px rgba(0,0,0,.6); }
label#rNameL { display: block; font-size: 18px; font-weight: 700; margin-top: 10px; }
#rName { margin-top: 6px; width: min(420px, 100%); padding: 9px 12px; font: 600 21px 'Barlow Condensed', sans-serif; background: rgba(255,255,255,.08); color: #fff; border: 2px solid rgba(255,255,255,.2); outline: none; user-select: text; }
#rName:focus { border-color: var(--o); }
#rRevT { font: 30px Anton, Impact, sans-serif; margin: 34px 0 10px; }
#rRev { list-style: none; padding: 0; display: grid; gap: 8px; }
#rRev li { display: flex; gap: 12px; background: rgba(255,255,255,.05); padding: 10px 12px; border-left: 4px solid var(--r); }
#rRev li.none { border-color: var(--g); font-size: 20px; }
#rRev em { font: 26px Anton, Impact, sans-serif; font-style: normal; color: var(--r); min-width: 38px; }
#rRev b { font-size: 19px; } #rRev p { margin: 3px 0; font-size: 17px; } #rRev p:first-of-type { color: var(--g); font-weight: 700; } #rRev .exp { opacity: .85; } #rRev small { opacity: .6; font-size: 14px; }
#pause { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: rgba(0,0,0,.6); z-index: 6; }
#pause.show { display: flex; }
#pT { font: 70px Anton, Impact, sans-serif; letter-spacing: 6px; }
@media (max-width: 640px) {
  #hTL { max-width: 58vw; } #hMission { font-size: 19px; } #hRoute { font-size: 14px; } #hCargo { font-size: 12px; }
  #hScore { font-size: 28px; } #hStars i { font-size: 18px; } #hTest { font-size: 14px; }
  #obj { top: auto; bottom: 200px; max-width: 92vw; } #sub { width: 92vw; font-size: 17px; }
  .mbtns button { min-width: 0; width: 100%; font-size: 22px; } #toastT { font-size: 32px; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div id="hTL"><div id="hMission"></div><div id="hRoute"></div><div id="hCargo"></div></div>
  <div id="hTR"><div id="hScore">0000000</div><div id="hStars"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></div><div id="hTest"></div><span id="hLights">◉ LUCES</span></div>
  <div id="obj"><div id="objT"></div><div id="objS"></div></div>
  <div id="sub"><span id="subWho"></span><span id="subText"></span></div>
  <div id="toast" class="toast"><div id="toastT"></div><div id="toastS"></div></div>
  <div id="touch"><button id="tLeft">◀</button><button id="tRight">▶</button><button id="tDown">▼</button><button id="tUp">▲</button><button id="tLights">LUZ</button><button id="tPause">II</button></div>
</div>
<div id="banner" class="banner"><div id="bSmall"></div><div id="bBig"></div><div id="bSub"></div></div>
<div id="big" class="big"><div id="bigT"></div><div id="bigS"></div></div>
<span id="hTitleSafety" hidden></span>

<div id="quiz"><div class="card">
  <div id="qHead"></div><div id="qText"></div><div class="timer"><div id="qTimer"></div></div>
  <div id="qOpts" class="opts"></div><div id="qFeed" class="feed"></div><button id="qGo" class="go"></button><div style="clear:both"></div>
</div></div>

<div id="pause"><div id="pT"></div><button id="pResume" class="btn"></button><button id="pQuit" class="btn ghost"></button></div>

<div id="menu" class="screen"><div class="menuIn">
  <div class="logo"><span class="l1">RUTA</span><span class="l2">PELIGROSA</span></div>
  <div id="mTag"></div>
  <div class="mbtns"><button id="bPlay"></button><button id="bMissions"></button><button id="bHow"></button><button id="bDiploma"></button><button id="bLang"></button></div>
  <div id="mProg"></div><div id="mDisc"></div>
</div></div>

<div id="missions" class="screen"><div class="inner">
  <h2 id="msTitle"></h2><div id="msList"></div>
  <div class="row"><button id="msBack" class="btn" data-back></button><button id="msReset" class="btn ghost"></button></div>
</div></div>

<div id="howto" class="screen"><div class="inner">
  <h2 id="howTitle"></h2><ul id="howList"></ul><div class="row"><button id="howBack" class="btn" data-back></button></div>
</div></div>

<div id="mpassed" class="screen"><div class="mpIn">
  <div id="mpTitle"></div><div id="mpSub"></div><div id="mpStats" class="stats"></div>
  <div class="row"><button id="mpNext" class="btn"></button><button id="mpMenu" class="btn ghost">Menú</button></div>
</div></div>

<div id="results" class="screen"><div class="inner">
  <div id="rTitle"></div><div id="rScore"></div><div id="rRank"></div><div id="rStats" class="stats"></div>
  <label id="rNameL" for="rName"></label><input id="rName" maxlength="40" autocomplete="name">
  <div class="dipWrap"><canvas id="dip" width="1600" height="1130"></canvas></div>
  <div class="row"><button id="rShare" class="btn"></button><button id="rDown" class="btn"></button><button id="rCopy" class="btn ghost"></button><button id="rMenu" class="btn ghost"></button></div>
  <h3 id="rRevT"></h3><ul id="rRev"></ul>
</div></div>

<script>
// ---- Datos del juego: fuentes, pruebas de manejo y las 10 misiones (100 pruebas) ----
// Cada pregunta: es/en = [pregunta, respuesta correcta, incorrecta 1, 2, 3, explicación].
// Cada panel: pan = [correcto, ...otros], es/en = [pregunta, explicación].

const SRC = {
  l51: ['Ley 24.449, art. 51 (velocidades máximas)', 'Law 24,449, sec. 51 (maximum speeds)'],
  l52: ['Ley 24.449, art. 52 (límites mínimos)', 'Law 24,449, sec. 52 (minimum limits)'],
  l47: ['Ley 24.449, art. 47 (uso de las luces)', 'Law 24,449, sec. 47 (use of lights)'],
  l48: ['Ley 24.449, art. 48 (prohibiciones)', 'Law 24,449, sec. 48 (prohibitions)'],
  alc: ['Ley 27.714 · art. 48 a) de la Ley 24.449 (alcohol cero)', 'Law 27,714 · sec. 48 a) of Law 24,449 (zero alcohol)'],
  l40: ['Ley 24.449, art. 40 (requisitos para circular)', 'Law 24,449, sec. 40 (requirements to drive)'],
  l41: ['Ley 24.449, art. 41 (prioridad de paso)', 'Law 24,449, sec. 41 (right of way)'],
  l42: ['Ley 24.449, art. 42 (adelantamiento)', 'Law 24,449, sec. 42 (overtaking)'],
  l59: ['Ley 24.449, art. 59 (obstáculos en la vía)', 'Law 24,449, sec. 59 (obstacles on the road)'],
  l61: ['Ley 24.449, art. 61 (vehículos de emergencia)', 'Law 24,449, sec. 61 (emergency vehicles)'],
  l65: ['Ley 24.449, art. 65 (obligaciones ante un accidente)', 'Law 24,449, sec. 65 (duties after an accident)'],
  r195: ['Res. SOPyT 195/97 (normas técnicas para el transporte de mercancías peligrosas)', 'Res. SOPyT 195/97 (technical rules for carrying dangerous goods)'],
  a35: ['Decreto 779/95, Anexo S, art. 35 (documentación a bordo)', 'Decree 779/95, Annex S, sec. 35 (documents on board)'],
  code: ['Res. 195/97 · código numérico de riesgo (Manual INTI, 5.4)', 'Res. 195/97 · hazard number code (INTI manual, 5.4)'],
  cls: ['Res. 195/97 · clases de mercancías peligrosas (Manual INTI, 7.4)', 'Res. 195/97 · dangerous goods classes (INTI manual, 7.4)'],
  list: ['Res. 195/97 · listado de mercancías peligrosas', 'Res. 195/97 · dangerous goods list'],
  sign: ['Res. 195/97 · paneles y rótulos de riesgo (Manual INTI, 6.5.2.2.2)', 'Res. 195/97 · orange panels and hazard labels (INTI manual, 6.5.2.2.2)'],
  eq: ['Decreto 779/95, Anexo S · equipamiento obligatorio (Manual INTI, 6.5.2.2.4)', 'Decree 779/95, Annex S · mandatory equipment (INTI manual, 6.5.2.2.4)'],

  g.fillStyle = '#fff'; g.font = `900 ${Math.round(r * 0.55)}px Anton, Impact, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(Math.round(S.v), cx, cy - 2);
  g.font = `700 ${Math.round(r * 0.2)}px Barlow Condensed, sans-serif`; g.fillStyle = 'rgba(255,255,255,.7)'; g.fillText('km/h', cx, cy + r * 0.38);
  if (small) signDisc(cx - r * 0.75, cy - r - 8, 17, String(lim)); else signDisc(cx - r - 30, cy + r * 0.45, 21, String(lim));
}

// ---- Pantallas ----
function showScreen(id) { document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('show', s.id === id)); }
function toMenu() { S.screen = 'title'; S.paused = false; $('pause').classList.remove('show'); closeQuiz(); hud(false); cv.style.filter = ''; $('big').classList.remove('show'); startMission(nextMission(), true); showScreen('menu'); texts(); }
function texts() {
  document.documentElement.lang = lang;
  $('mTag').textContent = t('tag');
  $('bPlay').textContent = doneCount() > 0 && doneCount() < M.length ? `${t('cont')} · ${t('mission')} ${nextMission() + 1}` : t('play');
  $('bMissions').textContent = t('missions'); $('bHow').textContent = t('how'); $('bDiploma').textContent = t('diploma'); $('bLang').textContent = t('other');
  $('bDiploma').classList.toggle('dim', doneCount() < M.length);
  $('mDisc').textContent = t('disc');
  $('mProg').innerHTML = doneCount() ? `<b>${passedTotal()}</b>/${TOTAL} ${t('tests')} ${t('cleared')} · <b>${fmt(totalPts())}</b> ${t('pts')}` : '';
  $('pT').textContent = t('pause'); $('pResume').textContent = t('resume'); $('pQuit').textContent = t('quit'); $('qGo').textContent = t('go');
  $('hTitleSafety').textContent = '';
}
$('bPlay').onclick = () => { if (doneCount() === M.length) { P.res = M.map(() => null); P.pts = M.map(() => 0); P.crashes = M.map(() => 0); save(); } startMission(nextMission()); };
$('bMissions').onclick = () => {
  const open = nextMission();
  $('msList').innerHTML = M.map((m, i) => {
    const r = P.res[i], lock = i > open && !r, ok = r ? r.filter((x) => x.ok).length : 0;
    return `<button class="mcard ${lock ? 'lock' : ''} ${r ? 'done' : ''}" data-i="${i}" ${lock ? 'disabled' : ''}><em>${i + 1}</em><span><b>${esc(m.name[L()])}</b><small>${esc(m.road)} · ${esc(m.from)} → ${esc(m.to)}</small><small>${esc(m.cargo.name[L()])}</small></span><i>${lock ? t('locked') : r ? `${ok}/10 · ${fmt(P.pts[i])}` : '—'}</i></button>`;
  }).join('');
  [...$('msList').children].forEach((b) => b.onclick = () => startMission(+b.dataset.i));
  $('msTitle').textContent = t('missions'); $('msBack').textContent = t('back'); $('msReset').textContent = t('reset');
  showScreen('missions');
};
$('msReset').onclick = () => { if (confirm(t('resetQ'))) { P = { res: M.map(() => null), pts: M.map(() => 0), crashes: M.map(() => 0), name: P.name }; save(); $('bMissions').onclick(); } };
$('bHow').onclick = () => { $('howTitle').textContent = t('howTitle'); $('howList').innerHTML = t('howText').map((x) => `<li>${x}</li>`).join(''); $('howBack').textContent = t('back'); showScreen('howto'); };
$('bDiploma').onclick = () => { if (doneCount() < M.length) { $('mProg').textContent = t('dipNeed'); return; } showResults(); };
$('bLang').onclick = () => { lang = lang === 'es' ? 'en' : 'es'; texts(); };
document.querySelectorAll('[data-back]').forEach((b) => b.onclick = () => toMenu());
$('pResume').onclick = () => togglePause();
$('pQuit').onclick = () => toMenu();

// ---- Resultado final y diploma ----
function rankOf(n) { return n >= 95 ? 4 : n >= 85 ? 3 : n >= 70 ? 2 : n >= 50 ? 1 : 0; }
function showResults() {
  S.screen = 'results'; hud(false);
  const n = passedTotal();
  $('rTitle').textContent = t('results'); $('rScore').innerHTML = `${n}<small>/100</small>`; $('rRank').textContent = t('ranks')[rankOf(n)];
  $('rStats').innerHTML = `<div><b>${fmt(totalPts())}</b><span>${t('points')}</span></div><div><b>${P.crashes.reduce((a, b) => a + b, 0)}</b><span>${t('crashes')}</span></div><div><b>${doneCount()}/10</b><span>${t('missionsDone')}</span></div>`;
  $('rNameL').textContent = t('name'); $('rName').placeholder = t('namePh'); $('rName').value = P.name || '';
  $('rDown').textContent = t('download'); $('rShare').textContent = t('share'); $('rCopy').textContent = t('copy'); $('rMenu').textContent = t('menu');
  // Repaso
  const fails = [];
  M.forEach((m, mi) => m.tests.forEach((ts, i) => { const r = P.res[mi] && P.res[mi][i]; if (r && !r.ok) fails.push({ mi, i, ts }); }));
  $('rRevT').textContent = t('review');
  $('rRev').innerHTML = fails.length ? fails.map(({ mi, i, ts }) => {
    const n = mi * 10 + i + 1; let q, a, exp;
    if (ts.t === 'q') { q = ts[lang][0]; a = ts[lang][1]; exp = ts[lang][5]; }
    else if (ts.t === 'p') { q = ts[lang][0]; a = ts.pan[0]; exp = ts[lang][1]; }
    else { const D = DRV[ts.t]; q = D[lang][0]; a = D[lang][1].replace('{sign}', M[mi].sign); exp = D[lang][2]; }
    const s = SRC[ts.s || DRV[ts.t].s][L()];
    return `<li><em>${n}</em><div><b>${esc(q)}</b><p>✓ ${esc(a)}</p><p class="exp">${esc(exp)}</p><small>${esc(s)}</small></div></li>`;
  }).join('') : `<li class="none">${t('none')}</li>`;
  drawDiploma(); showScreen('results');
}
$('rName').addEventListener('input', () => { P.name = $('rName').value.slice(0, 40); save(); drawDiploma(); });
$('rMenu').onclick = () => toMenu();
function dipData() { return { name: (P.name || '').trim() || t('driver'), n: passedTotal(), pts: totalPts(), crashes: P.crashes.reduce((a, b) => a + b, 0) }; }
function drawDiploma() {
  const c = $('dip'), x = c.getContext('2d'), Wd = 1600, Hd = 1130, d = dipData();
  c.width = Wd; c.height = Hd;
  const bg = x.createLinearGradient(0, 0, Wd, Hd); bg.addColorStop(0, '#141a22'); bg.addColorStop(0.55, '#1d2530'); bg.addColorStop(1, '#2a1a14'); x.fillStyle = bg; x.fillRect(0, 0, Wd, Hd);
  // Sol de atardecer
  const sun = x.createRadialGradient(Wd * 0.78, Hd * 0.2, 10, Wd * 0.78, Hd * 0.2, 520); sun.addColorStop(0, 'rgba(255,140,40,.35)'); sun.addColorStop(1, 'rgba(255,140,40,0)'); x.fillStyle = sun; x.fillRect(0, 0, Wd, Hd);
  // Borde de franjas de peligro
  x.save(); x.beginPath(); x.rect(0, 0, Wd, Hd); x.rect(34, 34, Wd - 68, Hd - 68); x.clip('evenodd');
  x.fillStyle = '#f28c1b'; x.fillRect(0, 0, Wd, Hd); x.fillStyle = '#111'; for (let i = -Hd; i < Wd + Hd; i += 56) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 28, 0); x.lineTo(i + 28 - Hd, Hd); x.lineTo(i - Hd, Hd); x.fill(); }
  x.restore();
  x.strokeStyle = '#d9b45a'; x.lineWidth = 3; x.strokeRect(56, 56, Wd - 112, Hd - 112);
  const center = (txt, y, font, color, stroke) => { x.font = font; x.textAlign = 'center'; x.textBaseline = 'alphabetic'; if (stroke) { x.lineWidth = stroke; x.strokeStyle = '#000'; x.lineJoin = 'round'; x.strokeText(txt, Wd / 2, y); } x.fillStyle = color; x.fillText(txt, Wd / 2, y); };
  x.save(); x.translate(Wd / 2, 190); x.rotate(-0.03); x.translate(-Wd / 2, -190);
  center('RUTA PELIGROSA', 200, 'italic 120px Anton, Impact, sans-serif', '#fff', 14); x.restore();
  center(t('dipTitle'), 268, '600 40px Barlow Condensed, Arial Narrow, sans-serif', '#f2b541');
  center(t('dipGiven'), 360, '600 34px Barlow Condensed, sans-serif', 'rgba(255,255,255,.75)');
  let fs = 92; x.font = `${fs}px Anton, Impact, sans-serif`; while (x.measureText(d.name).width > Wd - 360 && fs > 40) { fs -= 4; x.font = `${fs}px Anton, Impact, sans-serif`; }
  center(d.name, 458, `${fs}px Anton, Impact, sans-serif`, '#ffffff', 8);
  x.fillStyle = '#f28c1b'; x.fillRect(Wd / 2 - 300, 482, 600, 4);
  // Texto en dos líneas
  x.font = '30px Barlow Condensed, sans-serif'; const words = t('dipFor').split(' '); let line = '', lines = [];
  for (const w of words) { if (x.measureText(line + ' ' + w).width > 1000) { lines.push(line.trim()); line = w; } else line += ' ' + w; } lines.push(line.trim());
  lines.forEach((l, i) => center(l, 540 + i * 38, '30px Barlow Condensed, sans-serif', 'rgba(255,255,255,.85)'));
  // Puntuación
  center(`${d.n}/100`, 760, '170px Anton, Impact, sans-serif', '#7ee07e', 12);
  center(t('ranks')[rankOf(d.n)].toUpperCase(), 820, '600 44px Barlow Condensed, sans-serif', '#f2b541');
  const stars = 1 + rankOf(d.n); x.font = '54px sans-serif'; x.textAlign = 'center';
  for (let i = 0; i < 5; i++) { x.fillStyle = i < stars ? '#ffd600' : 'rgba(255,255,255,.18)'; x.fillText('★', Wd / 2 - 120 + i * 60, 890); }
  const date = new Date().toLocaleDateString(lang === 'en' ? 'en-GB' : 'es-AR');
  const row = [`${t('points')}: ${fmt(d.pts)}`, `${t('crashes')}: ${d.crashes}`, `${t('missionsDone')}: 10/10`, `${t('date')}: ${date}`].join('   ·   ');
  center(row, 950, '600 30px Barlow Condensed, sans-serif', '#fff');
  center(t('dipFoot'), 1030, '22px Barlow Condensed, sans-serif', 'rgba(255,255,255,.6)');
  center('dmarlonstudio.com', 1062, '600 22px Barlow Condensed, sans-serif', '#f2b541');
  // Panel naranja y rombo de clase como sellos
  const panel = (px, py) => { x.fillStyle = '#f28c1b'; x.fillRect(px, py, 220, 180); x.strokeStyle = '#111'; x.lineWidth = 10; x.strokeRect(px + 5, py + 5, 210, 170); x.beginPath(); x.moveTo(px, py + 90); x.lineTo(px + 220, py + 90); x.stroke(); x.fillStyle = '#111'; x.font = '64px Anton, Impact, sans-serif'; x.textAlign = 'center'; x.fillText('33', px + 110, py + 78); x.fillText('1203', px + 110, py + 162); };
  panel(130, 640);
  x.save(); x.translate(Wd - 240, 730); x.rotate(Math.PI / 4); x.fillStyle = '#d32f2f'; x.fillRect(-90, -90, 180, 180); x.strokeStyle = '#fff'; x.lineWidth = 6; x.strokeRect(-80, -80, 160, 160); x.rotate(-Math.PI / 4);
  x.fillStyle = '#fff'; x.beginPath(); x.moveTo(0, -70); x.bezierCurveTo(40, -30, 30, 0, 0, 20); x.bezierCurveTo(-30, 0, -40, -30, 0, -70); x.fill(); x.font = '56px Anton, Impact, sans-serif'; x.textAlign = 'center'; x.fillText('3', 0, 92); x.restore();
}
function dipBlob() { return new Promise((res) => $('dip').toBlob(res, 'image/png')); }
$('rDown').onclick = async () => { const b = await dipBlob(); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = lang === 'en' ? 'ruta-peligrosa-diploma.png' : 'ruta-peligrosa-diploma.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
const shareText = () => t('shareText').replace('{n}', passedTotal());
$('rShare').onclick = async () => {
  try {
    const b = await dipBlob(); const f = new File([b], 'ruta-peligrosa-diploma.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'RUTA PELIGROSA', text: shareText() }); return; }
    if (navigator.share) { await navigator.share({ title: 'RUTA PELIGROSA', text: shareText(), url: location.href }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  $('rDown').onclick();
};
$('rCopy').onclick = async () => { try { await navigator.clipboard.writeText(`${shareText()} ${location.href}`); $('rCopy').textContent = t('copied'); setTimeout(() => ($('rCopy').textContent = t('copy')), 1800); } catch (e) {} };

// ---- Pruebas automáticas (?auto=1) y API para las capturas ----
window.HZ = {
  _u: (dt) => update(dt), S, P, M, TOTAL, startMission, showResults, toMenu, openQuiz, answer, drawDiploma,
  // Juega una misión entera sin dibujar: el piloto automático respeta todo y responde bien.
  run(mi, opts = {}) {
    S.auto = true; S.autoWrong = !!opts.wrong; startMission(mi); let steps = 0;
    while (S.screen === 'drive' && steps < 200000) { if (S.quiz) closeQuiz(); update(1 / 30); steps++; if (opts.speeding && !S.quiz) { S.v = 95; } }
    S.auto = false; return { screen: S.screen, res: P.res[mi], pts: P.pts[mi], crashes: P.crashes[mi], steps };
  },
};

texts(); startMission(nextMission(), true); showScreen('menu');
requestAnimationFrame(frame);

</script>
